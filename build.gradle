import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
  id 'java'
  id 'application'
  id 'jacoco'
  id 'com.gradleup.shadow' version '9.5.1'
}


def getDevVersionName() {
  try {
    def output = providers.exec {
      executable 'git'
      args = ['describe', '--tags']
    }.standardOutput.asText.get().trim()
    // strip of leading "v"
    return output.substring(1)
  } catch (ignore) {
    println(ignore)
    logger.info('Error running git describe (' + ignore + '), defaulting to 0.0.0')
    return '0.0.0'
  }
}

def getVersionName() {
  try {
    def output = providers.exec {
      executable 'git'
      args = ['describe', '--tags', '--abbrev=0']
    }.standardOutput.asText.get().trim()
    // strip of leading "v"
    output = output.substring(1)
  } catch (ignore) {
    println(ignore)
    logger.info('Error running git describe (' + ignore + '), defaulting to 0.0.0')
    return '0.0.0'
  }
}

project.group = 'org.pharmgkb'
// always use base version to reduce churn with IDEA's external.system.module.version
project.version = getVersionName()

ext {
  moduleName = 'org.pharmgkb.pharmcat'
  description = 'The Pharmacogenomic Clinical Annotation Tool'
  url = 'https://github.com/PharmGKB/PharmCAT.git'
  scm = 'scm:git@github.com:PharmGKB/PharmCAT.git'
  orgName = 'ClinPGx'
  orgUrl = 'https://www.clinpgx.org'
  mainClassName = "org.pharmgkb.pharmcat.PharmCAT"
  archiveBaseName = "pharmcat"
  // this is the version we actually use
  version = getDevVersionName()
}

def dataDir = System.env.PHARMCAT_DATA_DIR == null ? 'build' : System.env.PHARMCAT_DATA_DIR


repositories {
  mavenCentral()
}

dependencies {
  implementation(
      'ch.qos.logback:logback-classic:1.5.37',
      'commons-cli:commons-cli:1.11.0',
      'commons-codec:commons-codec:1.22.0',
      'commons-io:commons-io:2.22.0',
      'com.github.jknack:handlebars:4.5.3',
      'com.google.code.gson:gson:2.14.0',
      'com.google.guava:guava:33.6.0-jre',
      'javax.xml.bind:jaxb-api:2.3.1',
      // used by poi; adding because transitive dependency has a security alert
      'org.apache.commons:commons-compress:1.28.0',
      'org.apache.commons:commons-lang3:3.20.0',
      'org.apache.commons:commons-text:1.15.0',
      'org.apache.httpcomponents:httpclient:4.5.14',
      'org.apache.logging.log4j:log4j-to-slf4j:2.26.1',
      'org.apache.poi:poi-ooxml:5.5.1',
      'org.jspecify:jspecify:1.0.0',
      'org.pharmgkb:pgkb-common:0.7.3',
      'org.pharmgkb:vcf-parser:0.3.1',
      'org.slf4j:slf4j-api:2.0.18'
  )

  testImplementation(
      'org.hamcrest:hamcrest:3.0',
      'org.jsoup:jsoup:1.22.2',
      'org.junit.jupiter:junit-jupiter:6.1.1',
      'org.junit.platform:junit-platform-launcher:6.1.1',
      'uk.org.webcompere:system-stubs-core:2.1.8',
      'uk.org.webcompere:system-stubs-jupiter:2.1.8'
  )
}


tasks.register('cleanTestOutput', Delete) {
  delete "${rootDir}/out/reports"
  delete "${rootDir}/out/pharmcat*"
}

clean.dependsOn(tasks.cleanTestOutput)

test.dependsOn(tasks.cleanTestOutput)

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
  withJavadocJar()
  withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

application {
  mainClass = project.ext.mainClassName
}

tasks.withType(JavaExec).configureEach {
  // hide restricted method warnings
  jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.withType(Test).configureEach {
  dependsOn 'jar', 'shadowJar', 'noLogbackJar'
  minHeapSize = "512m"
  maxHeapSize = "4096m"
  // hide restricted method warnings
  jvmArgs '--enable-native-access=ALL-UNNAMED'
  useJUnitPlatform()
  testLogging {
    // set options for log level LIFECYCLE
    events 'failed', 'standard_error'
    exceptionFormat = 'full'
    showStackTraces = true
  }

  doFirst {
    systemProperty 'pharmcat.thinJar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'pharmcat.shadowJar', tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'pharmcat.noLogbackJar', tasks.named('noLogbackJar').get().archiveFile.get().asFile.absolutePath
  }

  // always generate reports after tests are run
  finalizedBy jacocoTestReport
}

tasks.register('testOnJava21', Test) {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

tasks.register('testOnJava25', Test) {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

jacocoTestReport {
  // tests must be run before generating the report
  dependsOn test
  reports {
    xml.required = true // codecov depends on xml format report
    html.required = true
  }
}


jar {
  inputs.property('moduleName', project.ext.moduleName)
  manifest {
    attributes 'Automatic-Module-Name': project.ext.moduleName
    attributes 'Implementation-Title': project.name
    attributes 'Implementation-Version': project.ext.version
    attributes 'Main-Class': project.ext.mainClassName
  }
  archiveBaseName = project.ext.archiveBaseName
  archiveFileName = project.ext.archiveBaseName + "-" + project.ext.version + ".jar";
}

shadowJar {
  manifest {
    attributes 'Implementation-Title': project.name
    attributes 'Implementation-Version': project.ext.version
  }
  archiveBaseName = project.ext.archiveBaseName
  archiveFileName = project.ext.archiveBaseName + "-" + project.ext.version + "-all.jar";
}

tasks.register('noLogbackJar', ShadowJar) {
  group = 'build'
  description = 'Builds an executable jar without Logback so consumers can supply an SLF4J provider.'
  from sourceSets.main.output
  configurations = [project.configurations.runtimeClasspath]
  dependencies {
    exclude(dependency('ch.qos.logback:logback-classic'))
    exclude(dependency('ch.qos.logback:logback-core'))
  }
  exclude 'logback.xml'
  manifest {
    attributes 'Automatic-Module-Name': project.ext.moduleName
    attributes 'Implementation-Title': project.name
    attributes 'Implementation-Version': project.ext.version
    attributes 'Main-Class': project.ext.mainClassName
  }
  archiveBaseName = project.ext.archiveBaseName
  archiveFileName = project.ext.archiveBaseName + "-" + project.ext.version + "-no-logback.jar";
}

tasks.withType(Javadoc).configureEach {
  // disable the crazy super-strict doclint tool in Java 8
  options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.register('updateData', JavaExec) {
  dependsOn 'classes'
  mainClass = 'org.pharmgkb.pharmcat.util.DataManager'
  classpath = sourceSets.main.runtimeClasspath
  args = [
      '-a', file('src/main/resources/org/pharmgkb/pharmcat/definition/alleles'),
      '-p', file('src/main/resources/org/pharmgkb/pharmcat/phenotype'),
      '-m', file('src/main/resources/org/pharmgkb/pharmcat/reporter'),
      '-g', file('src/main/resources/org/pharmgkb/pharmcat/reporter'),
      '-doc', file('docs'),
  ]
}


tasks.register('updateExampleSamples', JavaExec) {
  dependsOn 'classes'
  mainClass = 'org.pharmgkb.pharmcat.util.SampleDataUpdater'
  classpath = sourceSets.main.runtimeClasspath
  args = [
      "${projectDir}"
  ]
}

tasks.register('updateExample1', JavaExec) {
  dependsOn 'classes'
  mainClass = 'org.pharmgkb.pharmcat.PharmCAT'
  classpath = sourceSets.main.runtimeClasspath
  args = [
      '-vcf', file('docs/examples/pharmcat.example.vcf'),
      '-po', file('docs/examples/pharmcat.example.outsideCall.tsv'),
      '-reporterCallsOnlyTsv', '-reporterJson', '-reporterHtml', '-matcherHtml'
  ]
}

tasks.register('updateExample2', JavaExec) {
  mainClass = 'org.pharmgkb.pharmcat.PharmCAT'
  classpath = sourceSets.main.runtimeClasspath
  args = [
      '-vcf', file('docs/examples/pharmcat.example2.vcf'),
      '-reporterCallsOnlyTsv', '-reporterJson', '-reporterHtml', '-matcherHtml'
  ]
}

tasks.register('testAutogeneratedVcfs', JavaExec) {
  dependsOn 'classes'
  mainClass = 'org.pharmgkb.pharmcat.haplotype.AutogeneratedVcfTester'
  classpath = sourceSets.main.runtimeClasspath
  jvmArgs = ['-Xmx8G']
  args = [
      '-vcf', new File(dataDir as File, 'testVcf'),
      '-o', new File(dataDir as File, 'autogeneratedTestResults'),
      '-skipSlowGenes'
  ]
}

